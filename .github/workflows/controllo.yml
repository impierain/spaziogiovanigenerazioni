name: Controllo
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  controllo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintassi di codice e interfaccia
        run: |
          for f in $(git ls-files 'src/**/*.mjs' 'src/*.mjs'); do node --check "$f"; done
          for f in $(git ls-files 'dist/*.js' 'scripts/*.mjs'); do node --check "$f"; done
      - name: Migrazioni su database di prova
        run: |
          npm install --no-save wrangler@4.159.0
          npx wrangler d1 migrations apply DB --local
      - name: Prove di integrazione
        run: |
          for t in tests/*.integration.mjs; do node "$t"; done
          node --test tests/*.test.mjs
      - name: Compattazione per la pubblicazione (prova su una copia)
        run: |
          mkdir -p /tmp/copia && cp -r dist /tmp/copia/
          node --input-type=module -e "import {minifyDist} from './scripts/minify.mjs'; await minifyDist('/tmp/copia');"
          for f in /tmp/copia/dist/*.js /tmp/copia/dist/app/*.js; do node --check "$f"; done
      - name: Prove delle pagine nel browser
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 tests/pagine.e2e.py

  # Se il controllo passa, unisce da solo le PR aperte da Piero su rami di questo repository.
  unione-automatica:
    needs: controllo
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'impierain' && github.actor == 'impierain'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Unisci la PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --merge
