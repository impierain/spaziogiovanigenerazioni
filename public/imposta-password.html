<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imposta la password - Spazio Giovani</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="center-screen">
  <div class="card" style="width:100%; max-width:380px;">
    <div class="brand">Spazio<br>Giovani <span class="accent">Generazioni</span></div>
    <div class="subtitle">Scegli la tua password</div>

    <form id="form-password">
      <label>Password (almeno 8 caratteri)</label>
      <input type="password" id="password" required minlength="8">
      <label>Ripeti la password</label>
      <input type="password" id="password2" required minlength="8">
      <button type="submit">Salva e accedi</button>
      <div class="error-msg" id="errore"></div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

document.getElementById('form-password').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errore = document.getElementById('errore');
  errore.textContent = '';

  const p1 = document.getElementById('password').value;
  const p2 = document.getElementById('password2').value;
  if (p1 !== p2) { errore.textContent = 'Le due password non coincidono.'; return; }
  if (!token) { errore.textContent = 'Link non valido: manca il codice.'; return; }

  try {
    await apiCall('/api/imposta-password', {
      method: 'POST',
      body: JSON.stringify({ token, password: p1 }),
    });
    alert('Password impostata! Ora puoi accedere.');
    window.location.href = '/index.html';
  } catch (err) {
    errore.textContent = err.message;
  }
});
</script>
</body>
</html>
