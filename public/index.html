<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accedi - Spazio Giovani Generazioni</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="center-screen">
  <div class="card" style="width:100%; max-width:380px;">
    <div class="brand">Spazio Giovani <span class="accent">Generazioni</span></div>
    <div class="subtitle">Gestionale ingressi &amp; attività</div>

    <form id="form-login">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">

      <button type="submit">Accedi</button>
      <div class="error-msg" id="errore"></div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errore = document.getElementById('errore');
  errore.textContent = '';
  try {
    const risultato = await apiCall('/api/login', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    window.location.href = risultato.utente.ruolo === 'admin' ? '/admin.html' : '/dashboard.html';
  } catch (err) {
    errore.textContent = err.message;
  }
});

// Se sei già loggato, saltiamo direttamente alla pagina giusta
utenteCorrente().then((u) => {
  if (u) window.location.href = u.ruolo === 'admin' ? '/admin.html' : '/dashboard.html';
});
</script>
</body>
</html>
