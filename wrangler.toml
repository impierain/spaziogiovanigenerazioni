name = "spaziogiovanigenerazioni"
main = "src/worker.mjs"
compatibility_date = "2026-01-01"

# Il sito statico (cartella dist/) viene servito dagli assets.
# Le richieste /api/* passano sempre dal Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "spaziogiovanigenerazioni"
# Compilare dopo: wrangler d1 create cca-siemmu
database_id = "DA_COMPILARE"
migrations_dir = "migrations"
