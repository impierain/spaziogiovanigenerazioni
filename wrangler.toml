name = "spaziogiovanigenerazioni"
main = "src/worker.mjs"
compatibility_date = "2026-01-01"

# Il sito statico (cartella dist/) viene servito dagli assets.
# Le richieste /api/* passano sempre dal Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "spaziogiovanigenerazioni"
database_id = "dcaae33c-5fe3-4967-80f5-b6fd1dd456dd"
migrations_dir = "migrations"
